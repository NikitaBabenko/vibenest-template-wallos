services:
  wallos:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
    - "80"
    environment:
      TZ: "UTC"
      VIBENEST_DEMO_RECOVERY_PASSWORD: "${VIBENEST_DEMO_RECOVERY_PASSWORD:-}"
    volumes:
    - wallos-db:/var/www/html/db
    - wallos-logos:/var/www/html/images/uploads/logos
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health.php"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
volumes:
  wallos-db:
  wallos-logos:
